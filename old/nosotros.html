<style>
/* ── Atelier Zero: Editorial-Warm palette ── */
:root {
  --bg:      oklch(96.5% 0.015 75);
  --surface: oklch(98.5% 0.008 75);
  --fg:      oklch(18% 0.02 60);
  --muted:   oklch(48% 0.015 60);
  --border:  oklch(88% 0.012 75);
  --accent:  oklch(52% 0.12 28);
  --accent-soft: oklch(78% 0.06 28);

  --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Times New Roman', serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:    ui-monospace, 'IBM Plex Mono', 'JetBrains Mono', Menlo, monospace;

  --max-width: 1280px;
  --gutter: clamp(1rem, 4vw, 3rem);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 100%; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-body);
  color: var(--fg);
  background: var(--bg);
  line-height: 1.6;
  overflow-x: hidden;
}

img, svg { max-width: 100%; display: block; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Typography ── */
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 400; line-height: 1.15; }
h1 { font-size: clamp(2.5rem, 6vw, 4.5rem); letter-spacing: -0.01em; }
h2 { font-size: clamp(1.8rem, 4vw, 3rem); }
h3 { font-size: clamp(1.3rem, 2.5vw, 1.75rem); }
h4 { font-size: clamp(1rem, 1.5vw, 1.2rem); }

.em-serif { font-family: var(--font-display); font-style: italic; }
.mono { font-family: var(--font-mono); font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.08em; }
.accent { color: var(--accent); }

/* ── Container ── */
.container { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--gutter); }
.section { padding: clamp(4rem, 8vw, 8rem) 0; position: relative; }
.section-label {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 1rem;
}

/* ── Topbar ── */
.topbar {
  width: 100%;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0.6rem var(--gutter);
  font-size: 0.7rem;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}
.topbar-brand { font-weight: 600; color: var(--fg); }

/* ── Nav ── */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255 255 255 / 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  transition: transform 0.3s;
}
nav.nav-hidden { transform: translateY(-100%); }
.nav-inner {
  max-width: var(--max-width);
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.8rem var(--gutter);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--fg);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.nav-logo:hover { text-decoration: none; }
.nav-logo-mark { color: var(--accent); font-size: 1.5rem; }
.nav-links {
  display: flex;
  gap: 1.5rem;
  list-style: none;
  font-size: 0.85rem;
}
.nav-links a {
  color: var(--muted);
  transition: color 0.2s;
  display: flex;
  align-items: center;
  gap: 0.3rem;
}
.nav-links a:hover { color: var(--fg); text-decoration: none; }
.nav-links a.active { color: var(--accent); }

/* ── Mobile menu toggle ── */
.menu-toggle {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  z-index: 101;
}
.menu-toggle span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--fg);
  transition: all 0.3s ease;
}
.menu-toggle.active span:nth-child(1) {
  transform: rotate(45deg) translate(5px, 5px);
}
.menu-toggle.active span:nth-child(2) {
  opacity: 0;
}
.menu-toggle.active span:nth-child(3) {
  transform: rotate(-45deg) translate(5px, -5px);
}

/* ── Hero ── */
.hero {
  min-height: calc(100vh - 120px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 4rem 0;
  position: relative;
}
.hero-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--accent);
  margin-bottom: 1.5rem;
}
.hero h1 { margin-bottom: 1.5rem; }
.hero h1 .em-serif { color: var(--accent); }
.hero-lead {
  font-size: clamp(1.1rem, 1.5vw, 1.3rem);
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 2.5rem;
  max-width: 32em;
}

/* ── Section themes ── */
.section-dark {
  background: oklch(15% 0.015 60);
  color: oklch(92% 0.005 80);
}
.section-dark .section-label { color: oklch(60% 0.015 60); }

.section-alt {
  background: var(--surface);
}

/* ── Team grid ── */
.team-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 2rem;
  margin-top: 2rem;
}
.team-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 2rem;
  transition: all 0.3s;
}
.team-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
.team-role {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
  margin-bottom: 0.75rem;
}
.team-card h3 { margin-bottom: 0.5rem; }
.team-card p { font-size: 0.9rem; color: var(--muted); line-height: 1.6; }

/* ── Values grid ── */
.values-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 2rem;
  margin-top: 2rem;
}
.value-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 2rem;
  transition: all 0.3s;
}
.value-card:hover { transform: translateY(-2px); }
.value-icon {
  font-size: 2rem;
  color: var(--accent);
  margin-bottom: 1rem;
}
.value-card h3 { margin-bottom: 0.75rem; }
.value-card p { font-size: 0.95rem; color: var(--muted); line-height: 1.6; }

/* ── Location ── */
.location-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: center;
}
.location-info p {
  font-size: 1.05rem;
  line-height: 1.8;
  color: var(--muted);
  margin-bottom: 1.5rem;
}
.location-map {
  aspect-ratio: 16/9;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}

/* ── Footer ── */
footer {
  background: var(--fg);
  color: oklch(88% 0.005 80);
  padding: 4rem 0 2rem;
}
.footer-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2rem;
  margin-bottom: 3rem;
}
.footer-col h4 {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: oklch(60% 0.01 60);
  margin-bottom: 1rem;
}
.footer-col ul { list-style: none; }
.footer-col li { margin-bottom: 0.5rem; }
.footer-col a { color: oklch(80% 0.005 80); font-size: 0.9rem; }
.footer-col a:hover { color: #fff; }
.footer-mega {
  font-family: var(--font-display);
  font-size: clamp(2rem, 5vw, 3.5rem);
  color: oklch(92% 0.005 80);
  line-height: 1.1;
  border-top: 1px solid oklch(30% 0.01 60);
  padding-top: 2rem;
  margin-top: 2rem;
}
.footer-mega .em-serif { color: var(--accent); font-style: italic; }
.footer-bottom {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: oklch(45% 0.01 60);
  border-top: 1px solid oklch(25% 0.01 60);
  padding-top: 1.5rem;
  margin-top: 1.5rem;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.5rem;
}

/* ── Reveal animations ── */
[data-reveal] {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
[data-reveal].revealed {
  opacity: 1;
  transform: translateY(0);
}
[data-reveal][data-delay="100"] { transition-delay: 0.1s; }
[data-reveal][data-delay="200"] { transition-delay: 0.2s; }
[data-reveal][data-delay="300"] { transition-delay: 0.3s; }

@media (prefers-reduced-motion: reduce) {
  [data-reveal] { opacity: 1; transform: none; transition: none; }
}

/* ── Responsive ── */
@media (max-width: 880px) {
  .footer-grid { grid-template-columns: repeat(2, 1fr); }
  .menu-toggle { display: flex; }
  .nav-links {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: rgba(255 255 255 / 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    flex-direction: column;
    padding: 1.5rem var(--gutter);
    gap: 1rem;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 6px rgba(0 0 0 0.05);
  }
  .nav-links.mobile-open {
    display: flex;
  }
  .nav-links a {
    padding: 0.75rem 0;
    font-size: 1rem;
  }
  .location-section { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .team-grid, .values-grid { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr; }
}

/* ── Paper texture overlay ── */
.paper-texture {
  position: relative;
}
.paper-texture::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  background-size: 256px 256px;
  pointer-events: none;
}

/* ── Leaf decorator - link back to main site ── */
@keyframes leaf-spin {
  0% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(15deg) scale(1.15); }
  50% { transform: rotate(-10deg) scale(1.2); }
  75% { transform: rotate(10deg) scale(1.1); }
  100% { transform: rotate(0deg) scale(1); }
}

    } else {
      nav.classList.remove('nav-hidden');
    }
    lastScroll = currentScroll;
  }, { passive: true });
})();

// ── Mobile menu toggle ──
(function() {
  const toggle = document.getElementById('menu-toggle');
  const menu = document.querySelector('.nav-links');
  if (toggle && menu) {
    toggle.addEventListener('click', () => {
      toggle.classList.toggle('active');
      menu.classList.toggle('mobile-open');
    });
    // Close menu when clicking a link
    menu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        toggle.classList.remove('active');
        menu.classList.remove('mobile-open');
      });
    });
  }
})();
</script>
<script>
// ── Geo Location: cambiar a Ibarra si visitante está en Imbabura ──
(function() {
  fetch('/api/location')
    .then(r => r.json())
    .then(data => {
      if (data && data.region === 'I') {
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(n => { if (n.nodeValue && n.nodeValue.includes('Quito')) n.nodeValue = n.nodeValue.replace(/Quito/g, 'Ibarra'); });
        if (document.title) document.title = document.title.replace(/Quito/g, 'Ibarra');
        document.querySelectorAll('[alt]').forEach(el => { if (el.alt && el.alt.includes('Quito')) el.alt = el.alt.replace(/Quito/g, 'Ibarra'); });
        const md = document.querySelector('meta[name=description]');
        if (md && md.content && md.content.includes('Quito')) md.content = md.content.replace(/Quito/g, 'Ibarra');
      }
    })
    .catch(() => {});
})();
</script>
