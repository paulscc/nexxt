<style>
/* ── Atelier Zero: Editorial-Warm palette ── */
:root {
  --bg:      oklch(96.5% 0.015 75);
  --surface: oklch(98.5% 0.008 75);
  --fg:      oklch(18% 0.02 60);
  --muted:   oklch(48% 0.015 60);
  --border:  oklch(88% 0.012 75);
  --accent:  oklch(52% 0.12 28);
  --accent-soft: oklch(78% 0.06 28);

  --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Times New Roman', serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:    ui-monospace, 'IBM Plex Mono', 'JetBrains Mono', Menlo, monospace;

  --max-width: 1280px;
  --gutter: clamp(1rem, 4vw, 3rem);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 100%; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-body);
  color: var(--fg);
  background: var(--bg);
  line-height: 1.6;
  overflow-x: hidden;
}

img, svg { max-width: 100%; display: block; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Typography ── */
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 400; line-height: 1.15; }
h1 { font-size: clamp(2.5rem, 6vw, 4.5rem); letter-spacing: -0.01em; }
h2 { font-size: clamp(1.8rem, 4vw, 3rem); }
h3 { font-size: clamp(1.3rem, 2.5vw, 1.75rem); }
h4 { font-size: clamp(1rem, 1.5vw, 1.2rem); }

.ds-serif { font-family: var(--font-body); }
.em-serif { font-family: var(--font-display); font-style: italic; }
.mono { font-family: var(--font-mono); font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.08em; }
.accent { color: var(--accent); }

/* ── Container ── */
.container { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--gutter); }
.section { padding: clamp(4rem, 8vw, 8rem) 0; position: relative; }
.section-label {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 1rem;
}

/* ── Topbar ── */
.topbar {
  width: 100%;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0.6rem var(--gutter);
  font-size: 0.7rem;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}
.topbar-brand { font-weight: 600; color: var(--fg); }

/* ── Nav ── */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255 255 255 / 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  transition: transform 0.3s;
}
nav.nav-hidden { transform: translateY(-100%); }
.nav-inner {
  max-width: var(--max-width);
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.8rem var(--gutter);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--fg);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.nav-logo:hover { text-decoration: none; }
.nav-logo-mark { color: var(--accent); font-size: 1.5rem; }
.nav-links {
  display: flex;
  gap: 1.5rem;
  list-style: none;
  font-size: 0.85rem;
}
.nav-links a {
  color: var(--muted);
  transition: color 0.2s;
  display: flex;
  align-items: center;
  gap: 0.3rem;
}
.nav-links a:hover { color: var(--fg); text-decoration: none; }
.nav-badge {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  background: var(--accent-soft);
  color: var(--accent);
  padding: 0.1rem 0.4rem;
  border-radius: 3px;
}
.nav-star {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 0.3rem;
}
.nav-star svg { width: 14px; height: 14px; fill: currentColor; }

/* ── Mobile hamburger menu ── */
.menu-toggle {
  display: none;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px;
  z-index: 200;
}
.menu-toggle span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--fg);
  transition: all 0.3s;
  border-radius: 1px;
}
.menu-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(4px, 4px); }
.menu-toggle.active span:nth-child(2) { opacity: 0; }
.menu-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(4px, -4px); }
@media (max-width: 880px) {
  .nav-links {
    display: none !important;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255,255,255,0.98);
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    z-index: 150;
    font-size: 1.2rem;
  }
  .nav-links.mobile-open { display: flex !important; }
  .menu-toggle { display: flex; }
  .nav-links a { font-size: 1.2rem; padding: 0.5rem; }
  .nav-star { display: none; }
}


/* ── Hero ── */
.hero {
  min-height: calc(100vh - 120px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 4rem 0;
  position: relative;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: center;
}
.hero-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--accent);
  margin-bottom: 1.5rem;
}
.hero h1 { margin-bottom: 1.5rem; }
.hero h1 .em-serif { color: var(--accent); }
.hero-lead {
  font-size: clamp(1.1rem, 1.5vw, 1.3rem);
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 2.5rem;
  max-width: 32em;
}
.hero-actions {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 3rem;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.85rem 2rem;
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}
.btn:hover { text-decoration: none; }
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-radius: 2px;
}
.btn-primary:hover { background: oklch(44% 0.12 28); transform: translateY(-1px); }
.btn-secondary {
  background: transparent;
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 2px;
}
.btn-secondary:hover { border-color: var(--muted); background: var(--surface); }

.hero-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
  padding-top: 2rem;
  border-top: 1px solid var(--border);
}
.stat-value {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 2.5vw, 2.2rem);
  color: var(--fg);
}
.stat-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.hero-image {
  aspect-ratio: 4/5;
  background: var(--border);
  overflow: hidden;
  position: relative;
}
.hero-image img { width: 100%; height: 100%; object-fit: cover; }

/* ── Section themes ── */
.section-dark {
  background: oklch(15% 0.015 60);
  color: oklch(92% 0.005 80);
}
.section-dark .section-label { color: oklch(60% 0.015 60); }
.section-dark .btn-secondary {
  border-color: oklch(35% 0.01 60);
  color: oklch(90% 0.005 80);
}
.section-dark .btn-secondary:hover { border-color: oklch(60% 0.01 60); }

.section-alt {
  background: var(--surface);
}

/* ── Stats rings (hero index) ── */
.hero-index {
  margin-top: 2rem;
  display: flex;
  gap: 1rem;
}
.index-ring {
  width: 44px;
  height: 44px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--muted);
  transition: all 0.3s;
  cursor: default;
  border-radius: 50%;
}
.index-ring:hover { border-color: var(--accent); color: var(--accent); }

/* ── Capabilities grid ── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 2rem;
  margin-top: 2rem;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 2rem;
  transition: all 0.3s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
.card-num {
  font-family: var(--font-display);
  font-size: 2.5rem;
  color: var(--accent);
  opacity: 0.3;
  line-height: 1;
  margin-bottom: 0.5rem;
}
.card-tag {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
  margin-bottom: 0.75rem;
}
.card h3 { margin-bottom: 0.75rem; }
.card p { font-size: 0.95rem; color: var(--muted); line-height: 1.6; }

/* ── Labs ── */
.labs-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 2rem;
}
.labs-pills {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.pill {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 0.3rem 0.8rem;
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 2px;
}
.pill.active { border-color: var(--accent); color: var(--accent); }
.pill:hover { border-color: var(--muted); }

.progress-bar {
  height: 2px;
  background: var(--border);
  margin-bottom: 2.5rem;
  position: relative;
}
.progress-fill {
  height: 100%;
  width: 40%;
  background: var(--accent);
  transition: width 0.6s ease;
}

.labs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.5rem;
}
.lab-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 1.5rem;
  position: relative;
  transition: all 0.3s;
}
.lab-card:hover { transform: translateY(-2px); }
.lab-card-num {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--accent);
  margin-bottom: 0.75rem;
}
.lab-card h4 { margin-bottom: 0.5rem; font-size: 1rem; }
.lab-card p { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
.lab-thumb {
  width: 100%;
  aspect-ratio: 16/10;
  background: var(--border);
  margin-bottom: 1rem;
  overflow: hidden;
}
.lab-thumb img { width: 100%; height: 100%; object-fit: cover; }

/* ── Method steps ── */
.method-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 2rem;
  margin-top: 2rem;
}
.method-step {
  position: relative;
  padding-top: 2.5rem;
}
.method-step::before {
  content: attr(data-num);
  position: absolute;
  top: 0;
  left: 0;
  font-family: var(--font-display);
  font-size: 3rem;
  color: var(--accent);
  opacity: 0.15;
  line-height: 1;
}
.method-tag {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
  margin-bottom: 0.5rem;
}
.method-step h3 { margin-bottom: 0.5rem; }
.method-step p { font-size: 0.9rem; color: var(--muted); line-height: 1.6; }
.method-thumb {
  width: 100%;
  aspect-ratio: 4/3;
  background: var(--border);
  margin-bottom: 1rem;
  overflow: hidden;
}
.method-thumb img { width: 100%; height: 100%; object-fit: cover; }

/* ── Work ── */
.work-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  margin-top: 2rem;
}
.work-card {
  background: oklch(20% 0.015 60);
  padding: 2.5rem;
  transform: rotate(-0.5deg);
  transition: all 0.4s;
  position: relative;
}
.work-card:nth-child(2) { transform: rotate(0.5deg) translateY(1rem); }
.work-card:hover { transform: rotate(0deg) translateY(-0.25rem); }
.work-card-category {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: oklch(60% 0.04 30);
  margin-bottom: 0.75rem;
}
.work-card h3 {
  font-size: 1.5rem;
  color: oklch(92% 0.005 80);
  margin-bottom: 0.5rem;
}
.work-card p { font-size: 0.9rem; color: oklch(70% 0.01 70); }

/* ── Testimonial ── */
.testimonial {
  text-align: center;
  max-width: 720px;
  margin: 0 auto;
  padding: 3rem 0;
}
.testimonial-quote {
  font-family: var(--font-display);
  font-size: clamp(1.2rem, 2vw, 1.6rem);
  line-height: 1.6;
  font-style: italic;
  margin-bottom: 1.5rem;
  position: relative;
}
.testimonial-quote::before {
  content: '\201C';
  font-size: 4rem;
  color: var(--accent);
  opacity: 0.2;
  position: absolute;
  top: -1.5rem;
  left: -1rem;
  font-family: var(--font-display);
  line-height: 1;
}
.testimonial-author {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}
.partners {
  display: flex;
  justify-content: center;
  gap: 2.5rem;
  margin-top: 2.5rem;
  flex-wrap: wrap;
}
.partner-glyph {
  width: 40px;
  height: 40px;
  opacity: 0.3;
  transition: opacity 0.3s;
}
.partner-glyph:hover { opacity: 0.6; }
.partner-glyph svg { width: 100%; height: 100%; fill: currentColor; }

/* ── CTA ── */
.cta-ribbon {
  background: var(--accent);
  color: #fff;
  padding: 4rem 0;
  text-align: center;
  position: relative;
}
.cta-ribbon::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: oklch(44% 0.12 28);
}
.cta h2 { margin-bottom: 1rem; }
.cta-ribbon h2 { color: #fff; }
.cta-ribbon p { font-size: 1.05rem; opacity: 0.85; margin-bottom: 2rem; max-width: 32em; margin-left: auto; margin-right: auto; }
.cta-form {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  flex-wrap: wrap;
}
.cta-form input {
  padding: 0.85rem 1.2rem;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 0.95rem;
  min-width: 280px;
  font-family: var(--font-body);
}
.cta-form input::placeholder { color: rgba(255,255,255,0.5); }
.cta-form input:focus { outline: none; border-color: #fff; }
.cta-form .btn {
  background: #fff;
  color: var(--accent);
  border-radius: 2px;
}
.cta-form .btn:hover { background: oklch(95% 0.01 80); }

/* ── Footer ── */
footer {
  background: var(--fg);
  color: oklch(88% 0.005 80);
  padding: 4rem 0 2rem;
}
.footer-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2rem;
  margin-bottom: 3rem;
}
.footer-col h4 {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: oklch(60% 0.01 60);
  margin-bottom: 1rem;
}
.footer-col ul { list-style: none; }
.footer-col li { margin-bottom: 0.5rem; }
.footer-col a { color: oklch(80% 0.005 80); font-size: 0.9rem; }
.footer-col a:hover { color: #fff; }
.footer-mega {
  font-family: var(--font-display);
  font-size: clamp(2rem, 5vw, 3.5rem);
  color: oklch(92% 0.005 80);
  line-height: 1.1;
  border-top: 1px solid oklch(30% 0.01 60);
  padding-top: 2rem;
  margin-top: 2rem;
}
.footer-mega .em-serif { color: var(--accent); font-style: italic; }
.footer-bottom {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: oklch(45% 0.01 60);
  border-top: 1px solid oklch(25% 0.01 60);
  padding-top: 1.5rem;
  margin-top: 1.5rem;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.5rem;
}

/* ── Reveal animations ── */
[data-reveal] {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
[data-reveal].revealed {
  opacity: 1;
  transform: translateY(0);
}
[data-reveal][data-delay="100"] { transition-delay: 0.1s; }
[data-reveal][data-delay="200"] { transition-delay: 0.2s; }
[data-reveal][data-delay="300"] { transition-delay: 0.3s; }
[data-reveal][data-delay="400"] { transition-delay: 0.4s; }
[data-reveal][data-delay="500"] { transition-delay: 0.5s; }

@media (prefers-reduced-motion: reduce) {
  [data-reveal] { opacity: 1; transform: none; transition: none; }
  .work-card, .card, .lab-card { transform: none !important; }
}

/* ── Responsive ── */
@media (max-width: 1080px) {
  .hero-grid { grid-template-columns: 1fr; gap: 2rem; }
  .hero-image { aspect-ratio: 16/9; max-height: 60vh; }
  .work-grid { grid-template-columns: 1fr; }
  .work-card:nth-child(2) { transform: rotate(0deg) translateY(0); }
}
@media (max-width: 880px) {
  .footer-grid { grid-template-columns: repeat(2, 1fr); }
  .nav-links { display: none; }
}
@media (max-width: 560px) {
  .hero-stats { grid-template-columns: 1fr; gap: 1rem; }
  .cards-grid, .labs-grid, .method-grid { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr; }
  .cta-form input { min-width: 100%; }
}

/* ── Dotted rules ── */
.ruler-dotted {
  border: none;
  border-top: 1px dotted var(--border);
  margin: 2rem 0;
}


/* ── Leaf decorator - link to new studio version ── */
.leaf-studio-link {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 9999;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  backdrop-filter: blur(4px);
  border: 1px solid var(--border, #ddd);
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  font-size: 1.2rem;
}
.leaf-studio-link:hover {
  transform: scale(1.1);
  border-color: var(--accent, #8B4513);
  background: rgba(255,255,255,0.8);
}
.leaf-studio-link:hover .leaf-icon {
  animation: leaf-spin 1.5s ease-in-out infinite;
}
@keyframes leaf-spin {
  0% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(15deg) scale(1.15); }
  50% { transform: rotate(-10deg) scale(1.2); }
  75% { transform: rotate(10deg) scale(1.1); }
  100% { transform: rotate(0deg) scale(1); }
}

/* ── Paper texture overlay ── */

// ── Smooth scroll for anchor links ──

  });
});

// ── CTA Form ──
(function() {
  const form = document.getElementById('cta-form-main');
  if (!form) return;
  const input = document.getElementById('cta-email-main');
  const btn = document.getElementById('cta-submit-main');
  const status = document.getElementById('cta-status-main');
  
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = input.value.trim();
    if (!email) return;
    
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    status.style.display = 'block';
    status.style.color = 'rgba(255,255,255,0.8)';
    status.textContent = 'Enviando...';
    
    try {
      const response = await fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const result = await response.json();
      if (result.success) {
        status.style.color = '#fff';
        status.textContent = '✓ ¡Gracias! Te contactaremos pronto.';
        input.value = '';
      } else {
        status.textContent = '✗ Error. Intenta de nuevo.';
      }
    } catch (error) {
      status.textContent = '✗ Error de conexión.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Comenzar';
    }
  });
})();

// ── Mobile menu toggle ──
(function() {
  const toggle = document.getElementById('menu-toggle');
  const menu = document.querySelector('.nav-links');
  if (toggle && menu) {
    toggle.addEventListener('click', () => {
      toggle.classList.toggle('active');
      menu.classList.toggle('mobile-open');
    });
    // Close menu when clicking a link
    menu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        toggle.classList.remove('active');
        menu.classList.remove('mobile-open');
      });
    });
  }
})();
</script>
<script>
// ── Geo Location: cambiar a Ibarra si el visitante está en Imbabura ──
(function() {
  fetch('/api/location')
    .then(r => r.json())
    .then(data => {
      if (data && data.region === 'I') {
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
        const nodesToReplace = [];
        while (walker.nextNode()) nodesToReplace.push(walker.currentNode);
        nodesToReplace.forEach(node => {
          if (node.nodeValue && node.nodeValue.includes('Quito')) {
            node.nodeValue = node.nodeValue.replace(/Quito/g, 'Ibarra');
          }
        });
        if (document.title) document.title = document.title.replace(/Quito/g, 'Ibarra');
        document.querySelectorAll('[alt]').forEach(el => {
          if (el.alt && el.alt.includes('Quito')) el.alt = el.alt.replace(/Quito/g, 'Ibarra');
        });
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc && metaDesc.content && metaDesc.content.includes('Quito')) {
          metaDesc.content = metaDesc.content.replace(/Quito/g, 'Ibarra');
        }
      }
    })
    .catch(() => {});
})();
</script>
